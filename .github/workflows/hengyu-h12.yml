name: Hengyu H12 Signal Worker

on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hengyu-h12-signal-worker
  cancel-in-progress: false

jobs:
  h12:
    name: Generate and ingest H12 paper signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HENGYU_API_BASE_URL: ${{ secrets.HENGYU_API_BASE_URL || 'https://hengyu-research.vercel.app' }}
      HENGYU_INGEST_SECRET: ${{ secrets.HENGYU_INGEST_SECRET }}
      HENGYU_WORKER_DRY_RUN: 'false'
    steps:
      - name: Check out Hengyu
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate production API
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HENGYU_INGEST_SECRET}" ]] || { echo "::error::Missing HENGYU_INGEST_SECRET"; exit 1; }
          curl --fail --show-error --silent "${HENGYU_API_BASE_URL%/}/api/health"
      - name: Run frozen H12 scanner
        shell: bash
        run: npm run worker:h12
